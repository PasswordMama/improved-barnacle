name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract zip and find the project
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            echo "Extracting ${zips[0]}"
            rm -rf _src && mkdir _src
            unzip -o -q "${zips[0]}" -d _src
            POM=$(find _src -name pom.xml -not -path '*/__MACOSX/*' | head -n1)
          else
            echo "No zip found, building the repo as is"
            POM=$(find . -name pom.xml -not -path './.git/*' | head -n1)
          fi
          [ -n "$POM" ] || { echo "No pom.xml found"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

      - name: Build
        run: mvn -B -f "$PROJECT_DIR/pom.xml" package

      - uses: actions/upload-artifact@v4
        with:
          name: CaneIslands
          path: ${{ env.PROJECT_DIR }}/target/*.jar
